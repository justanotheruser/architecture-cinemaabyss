apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  namespace: cinemaabyss
  labels:
    app: proxy-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-service
  template:
    metadata:
      labels:
        app: proxy-service
    spec:
      containers:
        - name: proxy-service
          image: ghcr.io/justanotheruser/architecture-cinemaabyss/proxy-service:1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: cinemaabyss-config
                  key: PORT
            - name: MONOLITH_URL
              valueFrom:
                configMapKeyRef:
                  name: cinemaabyss-config
                  key: MONOLITH_URL
            - name: MOVIES_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cinemaabyss-config
                  key: MOVIES_SERVICE_URL
            - name: EVENTS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cinemaabyss-config
                  key: EVENTS_SERVICE_URL
            - name: GRADUAL_MIGRATION
              valueFrom:
                configMapKeyRef:
                  name: cinemaabyss-config
                  key: GRADUAL_MIGRATION
            - name: MOVIES_MIGRATION_PERCENT
              valueFrom:
                configMapKeyRef:
                  name: cinemaabyss-config
                  key: MOVIES_MIGRATION_PERCENT
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  namespace: cinemaabyss
  labels:
    app: proxy-service
spec:
  type: ClusterIP
  selector:
    app: proxy-service
  ports:
    - name: http
      port: 8000
      targetPort: http
