{{- if .Values.proxyService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: proxy-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.proxyService.replicas }}
  selector:
    matchLabels:
      app: proxy-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: proxy-service
    spec:
      containers:
      - name: proxy-service
        image: {{ .Values.proxyService.image.repository }}:{{ .Values.proxyService.image.tag }}
        imagePullPolicy: {{ .Values.proxyService.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.proxyService.service.targetPort }}
        env:
          - name: PORT
            value: "{{ .Values.proxyService.service.targetPort }}"
          - name: MONOLITH_URL
            valueFrom:
              configMapKeyRef:
                name: cinemaabyss-config
                key: MONOLITH_URL
          - name: MOVIES_SERVICE_URL
            valueFrom:
              configMapKeyRef:
                name: cinemaabyss-config
                key: MOVIES_SERVICE_URL
          - name: EVENTS_SERVICE_URL
            valueFrom:
              configMapKeyRef:
                name: cinemaabyss-config
                key: EVENTS_SERVICE_URL
          - name: GRADUAL_MIGRATION
            valueFrom:
              configMapKeyRef:
                name: cinemaabyss-config
                key: GRADUAL_MIGRATION
          - name: MOVIES_MIGRATION_PERCENT
            valueFrom:
              configMapKeyRef:
                name: cinemaabyss-config
                key: MOVIES_MIGRATION_PERCENT
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.proxyService.service.targetPort }}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.proxyService.service.targetPort }}
          initialDelaySeconds: 20
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: proxy-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app: proxy-service
  ports:
    - name: http
      port: {{ .Values.proxyService.service.port }}
      targetPort: {{ .Values.proxyService.service.targetPort }}
{{ end }}